services:
  - type: web
    name: veritas
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./aspnet/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
