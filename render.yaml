services:
  - type: web
    name: veritas
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./aspnet/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: INTENTIONS_DB_PATH
        value: /data/intentions.sqlite3
    disk:
      name: veritas-data
      mountPath: /data
      sizeGB: 1
